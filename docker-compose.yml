version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings

volumes:
  chroma_data:
  media_data:
